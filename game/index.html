<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Bloom Bastion — a garden tower defence</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #79c25f; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block; touch-action: none; background: #79c25f;
    width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Bloom Bastion: plant towers on the lawn to stop fifteen waves of garden pests"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
